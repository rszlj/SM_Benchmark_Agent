# Copy to a private credentials.toml outside version control.
# Run the official `earthengine authenticate` sign-in separately.
# OAuth tokens remain in Earth Engine's own credential store.
# Set request.credential_ref to the copied TOML file, not the OAuth credential file.
# Relative configuration paths resolve against the command's working directory.
[gee]
project = "YOUR_AUTHORIZED_GEE_PROJECT"
# Agent credential route; this is not a CLI --auth_mode value.
auth_mode = "interactive"
